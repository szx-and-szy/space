<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>沈子翔 · space</title>

<style>
  :root {
    --bg: #fcfcfa;
    --ink: #14161a;
    --muted: #6b7280;
    --line: #e5e4e0;
    --card: #ffffff;
    --accent: #1f5eff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11;
      --ink: #ececea;
      --muted: #8b8f96;
      --line: #262a2f;
      --card: #16181b;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 88px 24px 64px;
  }
  .label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px;
  }
  h1 {
    font-size: clamp(34px, 7vw, 52px);
    line-height: 1.15;
    letter-spacing: -.02em;
    font-weight: 650;
    margin: 0 0 18px;
  }
  .lede {
    font-size: 17px;
    color: var(--muted);
    margin: 0 0 44px;
    max-width: 34em;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 56px;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    transition: border-color .18s ease, transform .18s ease;
  }
  .links a:hover { border-color: var(--ink); transform: translateY(-1px); }
  .links a span { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 0 0 40px;
  }
  h2 {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 14px;
  }
  section { margin-bottom: 40px; }
  p { margin: 0 0 12px; }
  .items { display: grid; gap: 14px; }
  .item {
    display: block;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    text-decoration: none;
    color: inherit;
    transition: border-color .18s ease;
  }
  .item:hover { border-color: var(--ink); }
  .item strong { display: block; font-weight: 600; margin-bottom: 3px; }
  .item em { font-style: normal; font-size: 14px; color: var(--muted); }
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    justify-content: space-between;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
